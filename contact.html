<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>
<main class="main" id="main">
<div class="main-inner">
<header class="page-head"><h1>Contact</h1><p class="lede">Questions about an order, a part, a CAD job or your Coyote swap. We read everything.</p></header>
<div class="contact">
  <form class="card" id="contact-form" novalidate>
    <div class="two">
      <div class="field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
    </div>
    <div class="two">
      <div class="field"><label for="c-phone">Phone (optional)</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="c-topic">What's it about?</label>
        <select id="c-topic" name="topic">
          <option value="general">General question</option>
          <option value="merch">Merch order</option>
          <option value="parts">Hard parts</option>
          <option value="cad">CAD &amp; 3D printing quote</option>
          <option value="coyote">Coyote swap help</option>
        </select></div>
    </div>
    <div class="field"><label for="c-message">Message</label><textarea id="c-message" name="message" required></textarea></div>
    <div class="hp" aria-hidden="true"><label for="c-website">Leave blank</label><input id="c-website" tabindex="-1" autocomplete="off"></div>
    <div><button class="btn orange" type="submit">Send message</button></div>
    <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>
  </form>
  <aside class="info" id="contact-info" aria-label="Contact details"></aside>
</div>

</div>
</main>
</div>
